name: 股票跌幅监控

on:
  schedule:
    - cron: '0 1-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: 运行股票监控
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: node stock_monitor.js

      - name: 提交告警状态
        if: always()
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "bot@example.com"
          test -f alert_state.json && git add alert_state.json || echo "alert_state.json 不存在，跳过"
          if git diff --cached --quiet; then
            echo "无变更。"
          else
            git commit -m "chore: 更新告警状态 [skip ci]"
            git push
          fi
