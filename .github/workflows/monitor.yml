name: 股票跌幅监控

on:
  schedule:
    # 北京时间 9:00-23:00 每小时整点执行（UTC 1:00-15:00）
    - cron: '0 1-15 * * 1-5'
  workflow_dispatch:  # 手动触发

permissions:
  contents: write   # 允许提交 alert_state.json

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install

      - name: 运行股票监控
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: node stock_monitor.js

      - name: 提交告警状态
        if: always()
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "bot@example.com"
          git add alert_state.json
          if git diff --cached --quiet; then
            echo "alert_state.json 无变更，跳过提交。"
          else
            git commit -m "chore: 更新告警状态 [skip ci]"
            git push
          fi
